<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Post Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cloud: '#F8FAFC',
                        slateSoft: '#E2E8F0',
                        midnight: '#0F172A',
                        electric: '#4F46E5',
                        accent: '#6366F1'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.08)',
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8FAFC;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .image-container:hover img {
            transform: scale(1.03);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 10px;
        }
        .btn-hover-effect {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2);
        }
        .student-id {
            color: #4F46E5;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- Header -->
    <header class="glass-header sticky top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-midnight rounded-lg flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="3"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
            </div>
            <span class="text-midnight font-bold tracking-tight text-lg">AI Post Previewer</span>
        </div>
        <div class="hidden md:flex items-center gap-4 text-slate-500 text-sm font-medium">
            <span>Instagram Preview Mode</span>
            <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 py-8 md:py-16 flex items-center justify-center">
        
        <!-- Main Mockup Container -->
        <div class="bg-white rounded-[24px] shadow-premium overflow-hidden w-full flex flex-col md:flex-row border border-slate-100">
            
            <!-- Image Section (Left) -->
            <div class="w-full md:w-1/2 bg-slate-50 relative aspect-square overflow-hidden group">
                <div class="image-container w-full h-full p-2">
                    <div class="w-full h-full rounded-[18px] overflow-hidden border border-slate-200 shadow-inner">
                        <img src='https://opal.google/board/blobs/c6134d5d-c06f-47f3-9a5b-4e7d8788cf52' alt='Osaka Travel' />
                    </div>
                </div>
            </div>

            <!-- Content Section (Right) -->
            <div class="w-full md:w-1/2 flex flex-col p-6 md:p-10 justify-between bg-white">
                <div>
                    <!-- Post Header -->
                    <div class="flex items-center justify-between mb-8">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 p-[2px]">
                                <div class="w-full h-full rounded-full bg-white p-[2px]">
                                    <div class="w-full h-full rounded-full bg-slate-100 flex items-center justify-center overflow-hidden">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col">
                                <span class="student-id text-sm uppercase">M11408904</span>
                                <span class="text-slate-400 text-xs font-medium">Osaka, Japan</span>
                            </div>
                        </div>
                        <button class="p-2 text-slate-400 hover:text-midnight transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                        </button>
                    </div>

                    <!-- Caption Content -->
                    <div class="custom-scrollbar overflow-y-auto max-h-[300px] mb-8 pr-2">
                        <p class="text-slate-800 leading-relaxed text-base">
                            <span class="student-id mr-2">M11408904</span>
                            大阪，我回來啦！✈️✨ 這座城市總是有著讓人無法抗拒的魅力。從道頓堀的浮誇招牌到環球影城的尖叫聲，每一刻都快門閃個不停！📸 尤其是在心齋橋吃到那口熱騰騰的章魚燒，真的太療癒了～🐙🍜 大家去大阪最愛吃什麼呢？趕快留言告訴我！👇
                        </p>
                        <div class="mt-4 flex flex-wrap gap-2">
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#大阪行</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#日本旅行</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#美食之旅</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#道頓堀</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#環球影城</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#心齋橋</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#旅遊日常</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#JapanTrip</span>
                            <span class="text-electric font-medium text-sm hover:underline cursor-pointer">#Osaka</span>
                        </div>
                    </div>
                </div>

                <!-- Footer Interactive Area -->
                <div class="pt-6 border-t border-slate-100">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-4">
                            <button class="text-slate-700 hover:text-red-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                            </button>
                            <button class="text-slate-700 hover:text-electric transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                            </button>
                            <button class="text-slate-700 hover:text-electric transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                            </button>
                        </div>
                        <button class="text-slate-700 hover:text-midnight transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="copyCaption()" class="btn-hover-effect bg-electric text-white py-3 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            Copy Caption
                        </button>
                        <button class="btn-hover-effect bg-slate-100 text-midnight py-3 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 hover:bg-slate-200">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
                            Share Post
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Identity -->
    <div class="w-full py-8 text-center">
        <p class="text-slate-400 text-xs tracking-[0.2em] font-medium uppercase">Project by M11408904</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-midnight text-white px-6 py-3 rounded-full text-sm font-medium shadow-2xl transition-all duration-500 opacity-0 pointer-events-none translate-y-4">
        Caption copied to clipboard!
    </div>

    <script>
        function copyCaption() {
            const captionText = "M11408904 大阪，我回來啦！✈️✨ 這座城市總是有著讓人無法抗拒的魅力。從道頓堀的浮誇招牌到環球影城的尖叫聲，每一刻都快門閃個不停！📸 尤其是在心齋橋吃到那口熱騰騰的章魚燒，真的太療癒了～🐙🍜 大家去大阪最愛吃什麼呢？趕快留言告訴我！👇\n\n#大阪行 #日本旅行 #美食之旅 #道頓堀 #環球影城 #心齋橋 #旅遊日常 #JapanTrip #Osaka";
            
            navigator.clipboard.writeText(captionText).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                    toast.classList.remove('opacity-100', 'translate-y-0');
                }, 3000);
            });
        }
    </script>
</body>
</html>
